<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sistema Fisiopals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <main class="container login-container px-3">
      <div class="card login-card shadow-soft">
        <div class="login-header">
          <img src="{{ url_for('static', filename='img/Fisiopals_logo.jpg') }}" alt="Logo de Fisiopals" class="login-logo" />
          <h1 class="login-title fs-3">Sistema Fisiopals</h1>
          <p class="text-soft mb-0 mt-2">Acceso administrativo</p>
        </div>
        <div class="login-body">
          {% with mensajes=get_flashed_messages(category_filter=['error_login']) %}
            {% if mensajes %}
              {% for mensaje in mensajes %}
                <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}
          <form action="/procesa/login" method="POST">
            <div class="mb-3">
              <label for="nombre_usuario" class="form-label">Nombre de usuario</label>
              <input type="text" id="nombre_usuario" name="nombre_usuario" class="form-control" autocomplete="username" autofocus required />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
