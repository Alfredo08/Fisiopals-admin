{% extends 'base.html' %}
{% block titulo %}
  Editar Servicio
{% endblock %}
{% block contenido %}
  <!-- Encabezado -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
      <h1 class="page-title">Editar servicio</h1>
      <p class="page-description">Actualiza la información y el precio de {{ servicio.nombre }}.</p>
    </div>
    <a href="/servicios/{{ servicio.id_servicio }}" class="btn btn-secondary">Volver al detalle</a>
  </div>
  <!-- Formulario -->
  <div class="card shadow-soft overflow-hidden">
    <div class="card-header">Información del servicio</div>
    <div class="card-body">
      <form action="/servicios/{{ servicio.id_servicio }}/actualizar" method="POST">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control" value="{{ servicio.nombre }}" required />
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" name="descripcion" class="form-control" rows="5" required>{{ servicio.descripcion }}</textarea>
          <small class="text-soft">Describe brevemente en qué consiste este servicio.</small>
        </div>
        <div class="mb-4">
          <label for="precio" class="form-label">Precio</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" id="precio" name="precio" class="form-control" step="0.01" min="0" value="{{ servicio.precio }}" required />
          </div>
        </div>
        <!-- Acciones -->
        <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
          <a href="/servicios/{{ servicio.id_servicio }}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
