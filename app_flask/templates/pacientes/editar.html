{% extends 'base.html' %}
{% block titulo %}
Editar Paciente
{% endblock %}
{% block contenido %}
<!-- Encabezado -->
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
        <h1 class="page-title">
            Editar paciente
        </h1>
        <p class="page-description">
            Actualiza la información y el expediente inicial de {{ paciente.nombre }}.
        </p>
    </div>
    <a
        href="/pacientes/{{ paciente.id_paciente }}"
        class="btn btn-secondary">
        Volver al expediente
    </a>
</div>
<!-- Formulario -->
<div class="card shadow-soft overflow-hidden">
    <div class="card-header">
        Información del paciente
    </div>
    <div class="card-body">
        <form
            action="/pacientes/{{ paciente.id_paciente }}/actualizar"
            method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label
                        for="id_cliente"
                        class="form-label">
                        Cliente
                    </label>
                    <select
                        id="id_cliente"
                        name="id_cliente"
                        class="form-select"
                        required>
                        {% for cliente in clientes %}
                            <option
                                value="{{ cliente.id_cliente }}"
                                {% if cliente.id_cliente == paciente.id_cliente %}
                                    selected
                                {% endif %}>
                                {{ cliente.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label
                        for="nombre"
                        class="form-label">
                        Nombre
                    </label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        value="{{ paciente.nombre }}"
                        required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label
                        for="especie"
                        class="form-label">
                        Especie
                    </label>
                    <select
                        id="especie"
                        name="especie"
                        class="form-select"
                        required>
                        <option
                            value="Canino"
                            {% if paciente.especie == 'Canino' %}
                                selected
                            {% endif %}>
                            Canino
                        </option>
                        <option
                            value="Felino"
                            {% if paciente.especie == 'Felino' %}
                                selected
                            {% endif %}>
                            Felino
                        </option>
                        <option
                            value="Equino"
                            {% if paciente.especie == 'Equino' %}
                                selected
                            {% endif %}>
                            Equino
                        </option>
                        <option
                            value="No convencional"
                            {% if paciente.especie == 'No convencional' %}
                                selected
                            {% endif %}>
                            No convencional
                        </option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label
                        for="raza"
                        class="form-label">
                        Raza
                    </label>
                    <input
                        type="text"
                        id="raza"
                        name="raza"
                        class="form-control"
                        value="{{ paciente.raza }}"
                        required>
                </div>
                <div class="col-md-4 mb-3">
                    <label
                        for="edad"
                        class="form-label">
                        Edad
                    </label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        class="form-control"
                        min="0"
                        value="{{ paciente.edad }}"
                        required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label
                        for="sexo"
                        class="form-label">
                        Sexo
                    </label>
                    <select
                        id="sexo"
                        name="sexo"
                        class="form-select"
                        required>
                        <option value="Macho"
                            {% if paciente.sexo == 'Macho' %}selected{% endif %}>
                            Macho
                        </option>

                        <option value="Macho castrado"
                            {% if paciente.sexo == 'Macho castrado' %}selected{% endif %}>
                            Macho castrado
                        </option>

                        <option value="Hembra"
                            {% if paciente.sexo == 'Hembra' %}selected{% endif %}>
                            Hembra
                        </option>

                        <option value="Hembra castrada"
                            {% if paciente.sexo == 'Hembra castrada' %}selected{% endif %}>
                            Hembra castrada
                        </option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label
                        for="inicio_problema"
                        class="form-label">
                        Inicio del problema
                        <span class="text-soft fw-normal">(opcional)</span>
                    </label>

                    <input
                        type="datetime-local"
                        id="inicio_problema"
                        name="inicio_problema"
                        class="form-control"
                        value="{% if paciente.inicio_problema %}{{ paciente.inicio_problema.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
                </div>
            </div>
            <div class="mb-3">
                <label
                    for="historia_clinica"
                    class="form-label">
                    Historia clínica
                    <span class="text-soft fw-normal">(opcional)</span>
                </label>
                <textarea
                    id="historia_clinica"
                    name="historia_clinica"
                    class="form-control"
                    rows="5">{{ paciente.historia_clinica or '' }}</textarea>
            </div>
            <div class="mb-4">
                <label
                    for="diagnostico_vet"
                    class="form-label">
                    Diagnóstico veterinario
                    <span class="text-soft fw-normal">(opcional)</span>
                </label>
                <textarea
                    id="diagnostico_vet"
                    name="diagnostico_vet"
                    class="form-control"
                    rows="4">{{ paciente.diagnostico_vet or '' }}</textarea>
            </div>
            <!-- Acciones -->
            <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
                <a
                    href="/pacientes/{{ paciente.id_paciente }}"
                    class="btn btn-secondary">
                    Cancelar
                </a>
                <button
                    type="submit"
                    class="btn btn-primary">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
